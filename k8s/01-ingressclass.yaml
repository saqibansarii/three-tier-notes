# EKS Auto Mode load balancing. Replace <ACM_CERT_ARN> with the certificate for the API hostname.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
  targetType: ip
  certificateARNs:
    - arn:aws:acm:eu-west-2:020784397875:certificate/5f5a9567-bd74-46b0-bc15-792e3fb83afc
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
